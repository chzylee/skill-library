# dev-build configuration for this repo — read by /skill-ops and
# scripts/dev-build-check.sh. Plain sh KEY="value".
# Set a repo or skill up for this with /skill-dev-rig; the template this file was
# made from lives at skill-dev-rig/templates/dev-build.conf.template.

# Skill folders live directly at the repo root (content-starter/, notion-digest/, …).
skills_root="."

# Branch names.
stable_branch="main"
dev_branch="dev"

# What promotion must update in THIS repo beyond moving the skill folder to main:
#
#   1. .claude-plugin/plugin.json — add "./<skill>" to the "skills" array.
#      NOTE: .claude-plugin/ exists on main only; it was never added to dev.
#      Edit it on main after the folder lands there, not on dev.
#   2. README.md — add a row to the "## Skills" catalog table:
#      | **<skill>** | <one-line what it does> | [README](<skill>/README.md) |
#      Draft the row for the maintainer's edit before inserting it.
#   3. dist/<skill>.skill — build the bundle (zip via python zipfile,
#      PYTHONUTF8=1 on Windows). Skip with a note for hook-installer skills.
#   4. The skill's own README "## Status" section — drop any "on the dev branch,
#      not yet promoted" language and the --branch dev fetch instruction.
#
# There is no plugin validate step gated on marketplace.json beyond
# `claude plugin validate .` passing on main.
release_steps="1. Add \"./<skill>\" to the skills array in .claude-plugin/plugin.json (main only — dev has no .claude-plugin/). 2. Add a README.md catalog table row, drafted for maintainer edit first. 3. Build dist/<skill>.skill. 4. Update the skill's own README Status section to drop dev-branch language. 5. claude plugin validate . must pass before pushing."
